[package]
name = "charker-matter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Matter bridge helper spawned by the Charker app (stdin/stdout JSON lines)"

[[bin]]
name = "charker-matter"
path = "src/main.rs"

[dependencies]
# rs-matter main (EPM/EEM/PowerTopology are not in a release yet; 0.4.1 lacks them),
# from a fork that caps subscription MaxInterval at 60 s so Home notices a
# restarted helper within a minute.
rs-matter = { git = "https://github.com/qzz0518/rs-matter", rev = "9c24d772755bf1c8a7981dbea8adca577eb2be9a", features = ["groups", "max-sessions-32"] }
astro-dnssd = "0.3.6"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["std"] }
embassy-time-queue-utils = { version = "0.3", features = ["generic-queue-64"] }
async-io = "2"
futures-lite = "2"
log = "0.4"
env_logger = "0.11"
rand = { version = "0.10", features = ["std", "std_rng", "thread_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 0.3.6 with the register callback's `send(..).unwrap()` made non-panicking.
[patch.crates-io]
astro-dnssd = { path = "vendor/astro-dnssd" }

[profile.release]
opt-level = "z"
debug = 0
codegen-units = 1
lto = "fat"
panic = "abort"

# rs-matter's build.rs generates ~30MB of cluster code; profiles of a
# dependency's own Cargo.toml do not apply here, so repeat the override.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2
